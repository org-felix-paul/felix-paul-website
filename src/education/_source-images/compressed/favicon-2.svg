<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Chalkboard-green rounded background -->
  <rect width="64" height="64" rx="11" fill="#2F4F4F"/>

  <!-- Chalk – upper section (writing tip + body above the laptop hinge, drawn first so the screen covers the middle) -->
  <circle cx="8" cy="8" r="2.8" fill="#F8FAFC"/>
  <path d="M 6 10 L 10 6 L 40 36 L 32 36 Z" fill="#F8FAFC"/>

  <!-- Laptop screen panel + teal "chalkboard glow" display -->
  <rect x="20" y="18" width="24" height="18" rx="1.5" fill="#2D3748"/>
  <rect x="22" y="20" width="20" height="14" rx="0.5" fill="#14B8A6"/>

  <!-- Laptop base – perspective trapezoid for subtle 3/4 angle -->
  <path d="M 16 36 L 48 36 L 53 44 L 11 44 Z" fill="#2D3748"/>
  <rect x="28" y="38" width="8" height="2" rx="0.5" fill="#4a5568"/>
  <rect x="10" y="43" width="44" height="2" rx="1" fill="#0f172a"/>

  <!-- Chalk – lower section (in front of the keyboard deck, completing the weave) -->
  <path d="M 32 36 L 40 36 L 58 54 L 54 58 Z" fill="#F8FAFC"/>

  <!-- Subtle chalk-dust accents near the writing tip -->
  <circle cx="4" cy="13" r="0.9" fill="#F8FAFC" opacity="0.75"/>
  <circle cx="12" cy="3.5" r="0.6" fill="#F8FAFC" opacity="0.6"/>
  <circle cx="2.5" cy="6" r="0.5" fill="#F8FAFC" opacity="0.5"/>
</svg>

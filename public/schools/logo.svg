<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#015aa0"/>

  <!-- Chalk stick, diagonal behind the laptop -->
  <g transform="rotate(-40 32 32)">
    <rect x="4" y="29" width="56" height="6" rx="2" fill="#ffffff"/>
    <rect x="4" y="29" width="6" height="6" rx="1.5" fill="#b8c2cc"/>
  </g>

  <!-- Laptop screen -->
  <rect x="14" y="20" width="36" height="22" rx="2.5" fill="#0a2540" stroke="#ffffff" stroke-width="2"/>

  <!-- Code lines on the screen -->
  <rect x="18" y="26" width="14" height="2" rx="1" fill="#4ade80"/>
  <rect x="18" y="31" width="20" height="2" rx="1" fill="#60a5fa"/>
  <rect x="18" y="36" width="10" height="2" rx="1" fill="#f472b6"/>

  <!-- Laptop base (trapezoid) -->
  <path d="M 8 42 L 56 42 L 52 48 L 12 48 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
  <rect x="28" y="42" width="8" height="1.5" rx="0.5" fill="#015aa0"/>
</svg>

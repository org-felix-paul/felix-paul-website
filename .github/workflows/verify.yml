# The same checks as the pre-push hook (npm run verify), on GitHub for every
# push and pull request. Catches pushes with --no-verify and clones without
# the hook. Cloudflare deploys independently; a red run here means: fix it.
name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
